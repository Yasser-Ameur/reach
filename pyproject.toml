[project]
name = "reach"
version = "0.1.0"
description = "Reach lets a developer hand Claude one Windows app at a time, read as a tree of named elements and driven by mouse and keyboard, with nothing touched that was not allowed at the keyboard."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["comtypes>=1.4", "mcp>=2.3"]

[project.scripts]
reach = "reach.server:main"

[project.optional-dependencies]
dev = ["mypy>=1.14", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reach"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RET", "RUF", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["comtypes", "comtypes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
